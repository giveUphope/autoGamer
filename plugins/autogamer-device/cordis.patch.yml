# AutoGamer device tools for DSH.
# Bundle patches are insert lists: each row adds an entry to the composed
# profile tree (id/name/config — see cordis-plugin-loader Entry Options).
# The preset's child-entry shape is a P0 spike item (see README).
- insert:
    - id: autogamer-device
      name: autogamer-device
    - id: preset-autogamer
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: autogamer
        name: AutoGamer
        description: Single-layer device execution agent (flash/pro merged, S11 router).
        plugins:
          - name: autogamer-device
          - name: "@deepseek-ai/dsh-tool-jobs"
