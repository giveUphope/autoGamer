# AutoGamer device tools for DSH.
# Bundle patches are insert lists: each row adds an entry to the composed
# profile tree (id/name/config — see cordis-plugin-loader Entry Options).
# The preset's child entry carries its own distinct row id — a bare
# `- name:` item would inherit the root row's id, which the root copy also
# uses; sessions mount the preset's plugins, the root row is inert for them.
- insert:
    - id: autogamer-device
      name: autogamer-device
    - id: preset-autogamer
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: autogamer
        name: AutoGamer
        description: Single-layer device execution agent (flash/pro merged, S11 router).
        plugins:
          - id: autogamer-device-inner
            name: autogamer-device
          - name: "@deepseek-ai/dsh-tool-jobs"
