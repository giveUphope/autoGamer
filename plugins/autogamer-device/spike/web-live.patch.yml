# Live web-profile overlay for the S10 spike (applies last via --patch).
# Declared contract (dsh --dump-config): each web session mounts its tools
# FROM ITS AGENT PRESET — every shipped preset row owns the tool entries its
# agent sees, and root-plane tool rows are invisible to sessions. So the
# plugin must be a plugin of preset-autogamer with its config INLINE on the
# preset's plugins entry (same shape as shipped preset-standard rows), and
# the root bundle copy is disabled here to avoid a duplicate instance.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local:
        apiKeyEnv: LOCAL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:1235/v1
        models:
          - id: qwen3.6-35b-a3b-mtp

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local
    model: qwen3.6-35b-a3b-mtp

- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: autogamer

- id: autogamer-device
  config:
    actionServerCommand:
      - node
      - D:/DEV/autoGamer/plugins/autogamer-device/scripts/mock-action-server.mjs

- id: preset-autogamer
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: autogamer
    name: AutoGamer
    description: Single-layer device execution agent (flash/pro merged, S11 router).
    plugins:
      - id: autogamer-device-inner
        name: autogamer-device
        config:
          actionServerCommand:
            - node
            - D:/DEV/autoGamer/plugins/autogamer-device/scripts/mock-action-server.mjs
