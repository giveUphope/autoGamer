# Live web-profile overlay for the S10 spike (applies last via --patch).
# Web profile HAS the preset registry (id-patch works there); the plugin
# stays enabled at root — the bundle patch already inserts it, and the
# selected preset's children reference it.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local:
        apiKeyEnv: LOCAL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:1235/v1
        models:
          - id: qwen3.6-35b-a3b-mtp

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local
    model: qwen3.6-35b-a3b-mtp

- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: autogamer

- id: autogamer-device
  name: autogamer-device
  config:
    actionServerCommand:
      - node
      - D:/DEV/autoGamer/plugins/autogamer-device/scripts/mock-action-server.mjs
