# Live web-profile overlay for the S10 spike (applies last via --patch).
#
# Preset shape here MATCHES cordis.patch.yml (the shipped delivery form):
# the AutoGamer preset carries only our own device tool row plus the host's
# tool-jobs row. The wide "standard + inner" list that used to sit here was a
# bisect rig for G30; G30 is closed, so measurements taken on that shape would
# not describe what we ship (gap tracked as G37).
#
# The root bundle copy stays disabled so exactly one instance can register.
#
# LLM rig: baseURL 1235 = scripts/dump-proxy.mjs -> LM Studio on 1234, so the
# wire shows exactly which tools the host sends. Set it back to 1234 to run
# without the logging proxy (proxy must be listening, or every turn dies on
# ECONNREFUSED).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local:
        apiKeyEnv: LOCAL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:1235/v1
        models:
          - id: qwen3.6-35b-a3b-mtp
            # Declared input modalities. The schema default is [], which the host
            # reads as NEGATIVE capability: an image tool result came back to the
            # model as "[image omitted because this model accepts text only]"
            # even though the route really does take pixels (verified directly
            # against LM Studio). G36.
            input:
              - text
              - image

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local
    model: qwen3.6-35b-a3b-mtp

- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: autogamer

- id: autogamer-device
  disabled: true

- id: preset-autogamer
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: autogamer
    name: AutoGamer
    description: Single-layer device execution agent (flash/pro merged, S11 router).
    order: 50
    plugins:
      # Same persona row as cordis.patch.yml (G45: without it the model never
      # receives the device contract at all). Keep the two presets in sync.
      - id: persona
        name: "@deepseek-ai/dsh-persona"
        config:
          prefix: |
            You are AutoGamer, an Android device operator. You drive one device
            through the run_device_action tool, which enforces the safety gate
            and checks that each action visibly changed the screen; you supply
            intent, targeting and the final report.

            1. One action per call, with a one-sentence reason. No narration
               between navigation or typing actions.
            2. The turn ends only through report_task_status: call it exactly
               once, as soon as the goal is met or no path forward remains.
               After that call, do not act on the device again, do not wait,
               do not report again.
            3. A handle such as #7 is valid only for the get_ui_hierarchy dump
               it came from. After any action that changes the screen, dump
               again before using a handle. Use normalized [x,y] coordinates
               only when no element matches.
            4. Never repeat a refused action verbatim: re-observe, change the
               target or the approach.
            5. Judge the screen only from screenshots; never claim a result
               you have not seen.
      - id: autogamer-device-inner
        name: autogamer-device
        config:
          actionServerCommand:
            - D:/DEV/autoGamer/.venv/Scripts/python.exe
            - -m
            - artemis.interfaces.cli.main
            - mcp
            - --type
            - adb
          actionServerEnv:
            ADB_DEVICE_SERIAL: "emulator-5554"
      - name: "@deepseek-ai/dsh-tool-jobs"
      # Same skill wiring as cordis.patch.yml (tests/deliveryShape.spec.ts compares
      # the two presets' contributed plugin names).
      - id: skill-filesystem
        name: "@deepseek-ai/dsh-skill-filesystem"
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('autogamer-device/package.json')), 'skills')
      - id: tool-skill
        name: "@deepseek-ai/dsh-tool-skill"
      # D17 row, kept identical to cordis.patch.yml (tests/deliveryShape.spec.ts
      # compares the two presets' contributed plugin names).
      - id: tool-plugin-manager
        name: "@deepseek-ai/dsh-plugin-manager/tools"
        disabled: false
